<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <title>Tengo Yo : image de partage (1200 x 630)</title>
  <!-- Gabarit Open Graph / Facebook. Rendu : node tools/social/render.mjs tools/social/og-image.html assets/social/og-image.jpg --size 1200x630 -->
  <style>
    @font-face { font-family: 'Luchados'; src: url('../../assets/fonts/Luchados.woff') format('woff'); }
    @font-face { font-family: 'Open Sans'; src: url('../../assets/fonts/open-sans-wght.woff2') format('woff2'); font-weight: 300 800; }

    html, body { margin: 0; background: #000; }

    .og {
      position: relative;
      width: 100vw; /* 1200 x 630 (Open Graph) ou 1280 x 640 (aperçu GitHub) : suit la taille de rendu */
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 470px 1fr;
      align-items: center;
      gap: 40px;
      /* Marges : tout le contenu reste dans les 80 % centraux (règle du skill) */
      padding: 0 90px 0 80px;
      box-sizing: border-box;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      background:
        radial-gradient(70% 80% at 22% 45%, rgba(255, 0, 127, 0.38), transparent 62%),
        radial-gradient(60% 70% at 92% 105%, rgba(255, 154, 0, 0.30), transparent 60%),
        radial-gradient(50% 60% at 95% -10%, rgba(0, 168, 89, 0.16), transparent 60%),
        #000;
    }

    /* Bande papel picado (festons) en haut et en bas */
    .og::before,
    .og::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 18px;
      background:
        radial-gradient(circle at 12px 0, #FF007F 11px, transparent 12px) 0 0 / 24px 18px repeat-x;
    }
    .og::before { top: 0; }
    .og::after { bottom: 0; transform: scaleY(-1); }

    .logo {
      justify-self: center;
      height: 540px;
      width: auto;
      filter: drop-shadow(0 10px 30px rgba(255, 0, 127, 0.45));
    }

    .copy { display: flex; flex-direction: column; align-items: flex-start; }

    .headline {
      margin: 0;
      font-family: 'Luchados', Impact, sans-serif;
      font-weight: normal;
      font-size: 132px;
      line-height: 0.9;
      color: #FF9A00;
      text-shadow: 6px 6px 0 #FF007F, 0 0 40px rgba(255, 154, 0, 0.35);
    }

    .sub {
      margin: 28px 0 0;
      font-size: 40px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.01em;
      max-width: 560px;
    }

    .sub em { font-style: normal; color: #FF9A00; }

    .pill {
      margin-top: 30px;
      padding: 12px 26px 13px;
      border-radius: 999px;
      background: #FF007F;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 6px 0 #a3004f;
    }
  </style>
</head>
<body>
  <div class="og">
    <img class="logo" src="../../assets/img/logo.webp" alt="Tengo Yo">
    <div class="copy">
      <h1 class="headline">¡Pensez<br>pareil!</h1>
      <p class="sub">1 thème, 15 secondes,<br><em>le même mot</em> = 1 point.</p>
      <span class="pill">Gratuit · sur un seul cell</span>
    </div>
  </div>
</body>
</html>
