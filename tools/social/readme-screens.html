<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <title>Tengo Yo : écrans du README (1600 x 900)</title>
  <!-- Rendu : node tools/social/render.mjs tools/social/readme-screens.html docs/readme/screens.png --size 1600x900 -->
  <!-- Les captures (docs/readme/screens/*.webp) sont prises sur un écran de 390 x 844, densité 2. -->
  <style>
    @font-face { font-family: 'Luchados'; src: url('../../assets/fonts/Luchados.woff') format('woff'); }
    @font-face { font-family: 'Open Sans'; src: url('../../assets/fonts/open-sans-wght.woff2') format('woff2'); font-weight: 300 800; }

    html, body { margin: 0; background: #000; }

    .board {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
      box-sizing: border-box;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      background:
        radial-gradient(45% 60% at 30% 40%, rgba(255, 0, 127, 0.30), transparent 65%),
        radial-gradient(45% 60% at 75% 70%, rgba(255, 154, 0, 0.22), transparent 65%),
        #000;
    }

    .board::before,
    .board::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 18px;
      background: radial-gradient(circle at 12px 0, #FF007F 11px, transparent 12px) 0 0 / 24px 18px repeat-x;
    }
    .board::before { top: 0; }
    .board::after { bottom: 0; transform: scaleY(-1); }

    .shot { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }

    /* Téléphone : 390 x 844 réduit à 320 de large */
    .phone {
      width: 320px;
      height: 692px;
      padding: 10px;
      border-radius: 46px;
      background: #1b1b1f;
      box-shadow: 0 0 0 2px #3a3a42, 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(255, 0, 127, 0.18);
    }
    .phone img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 37px; }

    .shot:nth-child(even) { transform: translateY(26px); }

    figcaption { display: flex; align-items: baseline; gap: 10px; font-size: 22px; font-weight: 700; }
    figcaption b {
      font-family: 'Luchados', Impact, sans-serif;
      font-weight: normal;
      font-size: 40px;
      color: #FF9A00;
      text-shadow: 3px 3px 0 #FF007F;
    }
  </style>
</head>
<body>
  <main class="board">
    <figure class="shot">
      <div class="phone"><img src="../../docs/readme/screens/home.webp" alt=""></div>
      <figcaption><b>1</b> Choisis le piquant</figcaption>
    </figure>
    <figure class="shot">
      <div class="phone"><img src="../../docs/readme/screens/card.webp" alt=""></div>
      <figcaption><b>2</b> 15 secondes, un mot</figcaption>
    </figure>
    <figure class="shot">
      <div class="phone"><img src="../../docs/readme/screens/timeup.webp" alt=""></div>
      <figcaption><b>3</b> Buzzer, on compare</figcaption>
    </figure>
    <figure class="shot">
      <div class="phone"><img src="../../docs/readme/screens/end.webp" alt=""></div>
      <figcaption><b>4</b> ¡Se acabó!</figcaption>
    </figure>
  </main>
</body>
</html>
